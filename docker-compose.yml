services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trivia_battle
    ports:
      - "5432:5432"
    volumes:
      - trivia_battle_pgdata:/var/lib/postgresql/data
volumes:
  trivia_battle_pgdata:
